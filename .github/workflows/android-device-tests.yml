name: Android device tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-device-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              python3 - <<'PY'
            import glob
            import xml.etree.ElementTree as ET

            for report in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
                try:
                    root = ET.parse(report).getroot()
                except (ET.ParseError, OSError):
                    continue
                for failure in root.findall(".//failure") + root.findall(".//error"):
                    message = " ".join((failure.get("message") or failure.text or "Android instrumentation test failed").split())
                    for token, escaped in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
                        message = message.replace(token, escaped)
                    print(f"::error title=Android instrumentation failure,file={report}::{message[:4000]}")
            PY
            fi
            exit "$test_status"
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
