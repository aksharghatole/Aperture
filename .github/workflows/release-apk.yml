name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Check tag matches app version
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ "v$version_name" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME must match app versionName v$version_name." >&2
            exit 1
          fi
      - name: Prepare persistent release signing
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APK_SIGNING_KEYSTORE_BASE64 APK_SIGNING_KEY_ALIAS APK_SIGNING_KEY_PASSWORD APK_SIGNING_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required repository secret $name is not configured." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/aperture-release.jks"
          printf '%s' "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "APERTURE_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "APERTURE_RELEASE_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "APERTURE_RELEASE_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "APERTURE_RELEASE_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test, lint, and build signed release APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 --title "Aperture $GITHUB_REF_NAME" --generate-notes
          fi
